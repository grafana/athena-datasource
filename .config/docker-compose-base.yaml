services:
  grafana:
    user: root
    container_name: 'grafana-athena-datasource'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.2.0}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 3000:3000/tcp
      - 2345:2345/tcp # delve
    security_opt:
      - 'apparmor:unconfined'
      - 'seccomp:unconfined'
    cap_add:
      - SYS_PTRACE
    volumes:
      - ../dist:/var/lib/grafana/plugins/grafana-athena-datasource
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/grafana-athena-datasource

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.grafana-athena-datasource:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-athena-datasource
      # Cloud-like AWS auth allowlist (no "default") reproduces incomplete
      # datasource initialization behavior locally.
      GF_AWS_ALLOWED_AUTH_PROVIDERS: ${GF_AWS_ALLOWED_AUTH_PROVIDERS:-keys,credentials,grafana_assume_role}
      GF_AWS_ASSUME_ROLE_ENABLED: ${GF_AWS_ASSUME_ROLE_ENABLED:-true}
      GF_AWS_EXTERNAL_ID: ${GF_AWS_EXTERNAL_ID:-local-dev-stack}
      GF_FEATURE_TOGGLES_ENABLE: ${GF_FEATURE_TOGGLES_ENABLE:-awsDatasourcesTempCredentials,awsAssumeRolePerDatasourceExternalId}
