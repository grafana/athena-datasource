name: Scheduled Cloud end-to-end tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests-cloud/**'
      - '.github/workflows/cron.yml'
      - 'playwright.cloud.config.ts'
      - 'playwright.config.ts'
      - 'package.json'

permissions:
  contents: read
  id-token: write

jobs:
  playwright-cloud:
    uses: grafana/data-sources-ci-workflows/.github/workflows/playwright-cloud.yml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      # Default bench-prepare-cmd assumes npm (package-lock.json); this repo is yarn-only.
      bench-prepare-cmd: yarn install --immutable; npx playwright install
      # Datasource is pre-provisioned in DSE2EDEV with creds baked in; no repo-secrets needed.
      bench-execute-cmd: yarn e2e:cloud
      # 'ci' isn't in playwright-cloud.yml's GHA vocabulary (pr/main/nightly); default to 'main'.
      run-stage: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'pull_request' && 'pr' || 'main' }}
