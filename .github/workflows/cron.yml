name: Nightly E2E

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  e2e:
    name: E2E
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@ci-cd-workflows/v10.1.0
    permissions:
      contents: read
      id-token: write
    with:
      playwright-config: playwright.config.ts
      playwright-secrets: |
        ACCESS_KEY=e2e:accessKey
        SECRET_KEY=e2e:secretKey
